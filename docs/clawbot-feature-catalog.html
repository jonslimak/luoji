<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clawbot Feature Catalog Viewer</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --text: #182026;
      --muted: #5f6b76;
      --line: #dde3ea;
      --accent: #1769aa;
      --good: #0f766e;
      --warn: #b45309;
      --exp: #7c3aed;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
      line-height: 1.4;
    }

    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    .sub {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 180px 180px 180px;
      gap: 10px;
      margin-bottom: 16px;
    }

    input, select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
    }

    .summary {
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 17px;
      line-height: 1.25;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 11px;
      letter-spacing: 0.02em;
      color: var(--muted);
      background: #f9fafb;
    }

    .pill.readiness-now { color: var(--good); border-color: #99f6e4; background: #f0fdfa; }
    .pill.readiness-later { color: var(--warn); border-color: #fcd34d; background: #fffbeb; }
    .pill.readiness-experimental { color: var(--exp); border-color: #ddd6fe; background: #f5f3ff; }
    .pill.status-done { color: #065f46; border-color: #6ee7b7; background: #ecfdf5; }
    .pill.status-partial { color: #92400e; border-color: #fcd34d; background: #fffbeb; }
    .pill.status-not-started { color: #9f1239; border-color: #fda4af; background: #fff1f2; }
    .pill.status-not-documented { color: #334155; border-color: #cbd5e1; background: #f8fafc; }

    .section {
      margin-top: 10px;
      border-top: 1px solid #eef2f6;
      padding-top: 9px;
    }

    .label {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .value {
      margin: 0;
      font-size: 13px;
    }

    .steps {
      margin: 0;
      padding-left: 18px;
      font-size: 13px;
    }

    .steps li { margin: 3px 0; }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 20px;
      color: var(--muted);
      background: #fff;
    }

    a.inline {
      color: var(--accent);
      text-decoration: none;
    }

    @media (max-width: 820px) {
      .toolbar {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Clawbot Feature Catalog</h1>
    <p class="sub">
      Browser view for
      <a class="inline" href="./clawbot-feature-catalog.md">clawbot-feature-catalog.md</a>
    </p>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Search feature name, category, purpose, setup..." />
      <select id="readiness">
        <option value="">All readiness</option>
        <option value="Now">Now</option>
        <option value="Later">Later</option>
        <option value="Experimental">Experimental</option>
      </select>
      <select id="status">
        <option value="">All status</option>
        <option value="Done">Done</option>
        <option value="Partial">Partial</option>
        <option value="Not Started">Not Started</option>
        <option value="Not Documented">Not Documented</option>
      </select>
      <select id="category">
        <option value="">All categories</option>
      </select>
    </div>

    <div id="summary" class="summary"></div>
    <div id="cards" class="grid"></div>
  </div>

  <script>
    const MD_PATH = "./clawbot-feature-catalog.md";
    const cardsEl = document.getElementById("cards");
    const searchEl = document.getElementById("search");
    const readinessEl = document.getElementById("readiness");
    const statusEl = document.getElementById("status");
    const categoryEl = document.getElementById("category");
    const summaryEl = document.getElementById("summary");

    let allFeatures = [];

    function cleanValue(value) {
      if (!value) return "";
      return value.trim().replace(/^`|`$/g, "");
    }

    function parseSteps(block) {
      const marker = "- `basic_setup_steps`:";
      const start = block.indexOf(marker);
      if (start === -1) return [];
      const from = block.slice(start + marker.length);
      const end = from.indexOf("\n- `configuration_recommendation`:");
      const section = end >= 0 ? from.slice(0, end) : from;
      return section
        .split("\n")
        .map((line) => line.trim())
        .filter((line) => /^\d+\.\s+/.test(line))
        .map((line) => line.replace(/^\d+\.\s+/, "").trim());
    }

    function parseFeatureBlock(block) {
      const fields = {};
      const lineRegex = /^- `([^`]+)`: ?(.*)$/gm;
      let m;
      while ((m = lineRegex.exec(block)) !== null) {
        fields[m[1]] = cleanValue(m[2]);
      }

      const steps = parseSteps(block);
      const feature = {
        id: fields.feature_id || "",
        name: fields.feature_name || "Untitled",
        category: fields.category || "Uncategorized",
        what: fields.what_it_does || "",
        why: fields.why_helpful || "",
        config: fields.configuration_recommendation || "",
        deps: fields.dependencies || "",
        impact: Number(cleanValue(fields.impact_score || "0")) || 0,
        effort: Number(cleanValue(fields.effort_score || "0")) || 0,
        readiness: cleanValue(fields.readiness || ""),
        status: cleanValue(fields.status || ""),
        confidence: cleanValue(fields.confidence || ""),
        sources: cleanValue(fields.source_articles || ""),
        notes: fields.notes || "",
        risks: fields.notes_and_risks || "",
        steps
      };
      return feature;
    }

    function parseMarkdown(md) {
      const start = md.indexOf("## Feature Blocks");
      const end = md.indexOf("## Selection Worksheet");
      if (start === -1 || end === -1 || end <= start) return [];

      const section = md.slice(start, end);
      const blocks = [];
      const regex = /### Feature Block \d+\n([\s\S]*?)(?=\n### Feature Block \d+\n|$)/g;
      let match;
      while ((match = regex.exec(section)) !== null) {
        blocks.push(parseFeatureBlock(match[1]));
      }
      return blocks.filter((f) => f.id && f.name);
    }

    function readinessClass(readiness) {
      const value = (readiness || "").toLowerCase();
      if (value === "now") return "readiness-now";
      if (value === "later") return "readiness-later";
      if (value === "experimental") return "readiness-experimental";
      return "";
    }

    function statusClass(status) {
      const value = (status || "").toLowerCase();
      if (value === "done") return "status-done";
      if (value === "partial") return "status-partial";
      if (value === "not started") return "status-not-started";
      if (value === "not documented") return "status-not-documented";
      return "";
    }

    function esc(s) {
      return (s || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function render(features) {
      if (!features.length) {
        cardsEl.innerHTML = '<div class="empty">No feature blocks matched your filters.</div>';
        summaryEl.textContent = "0 features shown.";
        return;
      }

      summaryEl.textContent = `${features.length} feature${features.length === 1 ? "" : "s"} shown`;

      cardsEl.innerHTML = features.map((f) => {
        const steps = f.steps.length
          ? `<ol class="steps">${f.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol>`
          : `<p class="value">No setup steps captured.</p>`;

        return `
          <article class="card">
            <h2>${esc(f.name)}</h2>
            <div class="meta">
              <span class="pill">${esc(f.id)}</span>
              <span class="pill">${esc(f.category)}</span>
              <span class="pill ${readinessClass(f.readiness)}">${esc(f.readiness)}</span>
              <span class="pill ${statusClass(f.status)}">Status: ${esc(f.status || "Unknown")}</span>
              <span class="pill">Confidence: ${esc(f.confidence)}</span>
              <span class="pill">Impact ${esc(String(f.impact))} / Effort ${esc(String(f.effort))}</span>
            </div>

            <section class="section">
              <p class="label">What It Does</p>
              <p class="value">${esc(f.what)}</p>
            </section>

            <section class="section">
              <p class="label">Why Helpful</p>
              <p class="value">${esc(f.why)}</p>
            </section>

            <section class="section">
              <p class="label">Basic Setup Steps</p>
              ${steps}
            </section>

            <section class="section">
              <p class="label">Configuration Recommendation</p>
              <p class="value">${esc(f.config)}</p>
            </section>

            <section class="section">
              <p class="label">Dependencies</p>
              <p class="value">${esc(f.deps)}</p>
            </section>

            <section class="section">
              <p class="label">Source Articles</p>
              <p class="value">${esc(f.sources)}</p>
            </section>

            <section class="section">
              <p class="label">Implementation Notes</p>
              <p class="value">${esc(f.notes || "No implementation notes yet.")}</p>
            </section>

            <section class="section">
              <p class="label">Notes and Risks</p>
              <p class="value">${esc(f.risks)}</p>
            </section>
          </article>
        `;
      }).join("");
    }

    function populateCategories(features) {
      const categories = [...new Set(features.map((f) => f.category).filter(Boolean))].sort();
      const options = ['<option value="">All categories</option>']
        .concat(categories.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`));
      categoryEl.innerHTML = options.join("");
    }

    function applyFilters() {
      const search = searchEl.value.trim().toLowerCase();
      const readiness = readinessEl.value;
      const status = statusEl.value;
      const category = categoryEl.value;

      const filtered = allFeatures.filter((f) => {
        const text = [
          f.id, f.name, f.category, f.what, f.why, f.config, f.deps, f.sources, f.risks, f.status, f.notes, ...f.steps
        ].join(" ").toLowerCase();

        const matchesSearch = !search || text.includes(search);
        const matchesReadiness = !readiness || f.readiness === readiness;
        const matchesStatus = !status || f.status === status;
        const matchesCategory = !category || f.category === category;
        return matchesSearch && matchesReadiness && matchesStatus && matchesCategory;
      });

      render(filtered);
    }

    async function init() {
      try {
        const res = await fetch(MD_PATH, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const md = await res.text();
        allFeatures = parseMarkdown(md);
        allFeatures.sort((a, b) => (b.impact - a.impact) || (a.effort - b.effort));
        populateCategories(allFeatures);
        applyFilters();
      } catch (err) {
        cardsEl.innerHTML = `
          <div class="empty">
            Could not load <code>${MD_PATH}</code>.
            If you opened this as <code>file://</code>, start a local server in
            <code>/Users/luo/Projects/luoji/docs</code> and open this page via <code>http://localhost</code>.
          </div>
        `;
        summaryEl.textContent = "Load error";
      }
    }

    searchEl.addEventListener("input", applyFilters);
    readinessEl.addEventListener("change", applyFilters);
    statusEl.addEventListener("change", applyFilters);
    categoryEl.addEventListener("change", applyFilters);
    init();
  </script>
</body>
</html>
